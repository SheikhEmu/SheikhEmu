[package]
name = "se-cli"
description = "SheikhEmu command-line interface (Arabic-native)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "se-cli"
path = "src/main.rs"

# Internal path deps are pinned: version-less path deps are wildcards (*)
# and trip the cargo-deny `wildcards = "deny"` ban.
[dependencies]
se-core = { path = "../se-core", version = "0.1.0" }
se-rom = { path = "../se-rom", version = "0.1.0" }
