# cargo-deny configuration.
# The workspace has exactly three external crates, all in
# se-frontend only (D-27 winit+softbuffer, D-40/M4.3 cpal): every
# other crate stays stdlib-only and these settings guard that.

[advisories]
unmaintained = "workspace"

[licenses]
# D-27 note (2026-11-13): the two permissive additions below
# (BSD-2-Clause for arrayref, ISC for libloading) exist only because
# the owner-approved winit + softbuffer whitelist (se-frontend only)
# transitively pulls exactly those two crates; both are OSI
# permissive licenses in the same family as BSD-3-Clause, already
# allowed. Nothing viral or copyleft entered the tree.
# D-40 note (2026-11-14, M4.3): the cpal 0.18.2 tree was audited in
# full (union of the linux/windows/macos targets, 132 external
# name@version pairs incl. the winit+softbuffer lines — table in
# docs/LEGAL_POLICY.md) and needed ZERO new allow entries: every
# license expression in it resolves against this list (MIT /
# Apache-2.0 / BSD-2-Clause / BSD-3-Clause / Zlib / ISC / Unlicense /
# Unicode-3.0 / Apache-2.0 WITH LLVM-exception). No viral,
# copyleft or share-alike license exists anywhere in the tree.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "0BSD",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
# D-27 note (2026-11-13): the skip list below is the explicit,
# enumerated, justified accommodation of the unavoidable duplicate
# major versions inside the winit + softbuffer transitive trees
# (owner-approved external crates, se-frontend only). The deny stays
# the rule: anything not on this list still fails the gate.
# D-40 note (2026-11-14, M4.3): adding cpal 0.18.2 (owner-approved,
# se-frontend only) required exactly ONE new skip — block2@0.5.1 —
# with its written reason inline; every other duplicate in the
# combined three-crate tree was already covered by the D-27 list.
skip = [
    { crate = "bitflags@1.3.2", reason = "winit's core-graphics 0.23 (macOS) and redox_syscall 0.4 still build on bitflags 1.x" },
    { crate = "block2@0.5.1", reason = "winit's objc2-foundation 0.2 line still builds on block2 0.5 while cpal 0.18's coreaudio path (D-40/M4.3) uses block2 0.6" },
    { crate = "getrandom@0.3.4", reason = "ahash (winit's hasher dep) builds on getrandom 0.3 while cc's jobserver uses 0.4" },
    { crate = "jni-sys@0.3.1", reason = "android-activity (winit) uses jni-sys 0.3 alongside jni 0.4's own jni-sys 0.4" },
    { crate = "objc2@0.5.3", reason = "winit's macOS backend uses objc2 0.5 while objc2-foundation 0.3 uses objc2 0.6" },
    { crate = "objc2-foundation@0.2.2", reason = "winit's core-graphics 0.23 uses objc2-foundation 0.2 alongside the 0.3 line" },
    { crate = "r-efi@5.3.0", reason = "rustix 0.38 (winit/softbuffer) carries r-efi 5 while rustix 1.x carries 6" },
    { crate = "rustix@0.38.44", reason = "winit's wayland/udev path uses rustix 0.38 while softbuffer's drm path uses rustix 1.x" },
    { crate = "syn@2.0.119", reason = "thiserror 1.x (core-graphics 0.23 line) still derives through syn 2 while objc2 0.6 uses syn 3" },
    { crate = "thiserror@1.0.69", reason = "the core-graphics 0.23 line (winit, macOS) still uses thiserror 1.x" },
    { crate = "thiserror-impl@1.0.69", reason = "the thiserror 1.x implementation crate of the entry above" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38's baseline linux-raw-sys 0.4 (with its drm feature on 0.9 and rustix 1.x on 0.12)" },
    { crate = "linux-raw-sys@0.9.4", reason = "rustix 0.38's drm feature needs linux-raw-sys 0.9's modules" },
    { crate = "redox_syscall@0.4.1", reason = "winit's bitflags-1 era redox_syscall 0.4 line (with 0.5 from libredox and 0.9 elsewhere)" },
    { crate = "redox_syscall@0.5.18", reason = "libredox (winit) uses redox_syscall 0.5" },
    { crate = "windows-sys@0.52.0", reason = "winit's windows-sys 0.52 line (core-graphics-era deps on other platforms pin 0.59/0.61)" },
    { crate = "windows-sys@0.59.0", reason = "softbuffer and winit's newer Windows deps use windows-sys 0.59" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
