[workspace]
resolver = "2"
members = ["crates/se-core", "crates/se-rom", "crates/se-cli", "crates/se-frontend"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# B-05 closed 2026-11-11: MIT, chosen explicitly by the owner
# (see LICENSE and DECISIONS.md D-14).
license = "MIT"
publish = false

# NOTE: se-core, se-rom and se-cli are zero-dependency by design
# (stdlib only). The single sanctioned exception is D-27
# (owner-approved 2026-11-13): se-frontend may use exactly winit and
# softbuffer; the cost gate enforces the whitelist.
