name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Web target builds
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p se-core -p se-rom --target wasm32-unknown-unknown

  gates:
    name: compliance gates (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: Release build
        run: cargo build --release -p se-cli
      - name: Test ROMs
        run: make test-roms
      - name: Board verification ROMs
        run: make boards
      - name: Provenance gate
        run: tools/provenance_check.sh
      - name: Cost gate
        run: tools/cost_check.sh
      - name: Files gate
        run: tools/check_files.sh
      - name: Size gate
        run: tools/size_check.sh
      - name: Golden determinism gate
        run: tools/check_golden.sh
      - name: Constant sniff (advisory)
        run: tools/constant_sniff.sh
